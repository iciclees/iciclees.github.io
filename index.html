<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Web App Hub</title>

	<style>
		/* ------------------------------
			THEME VARIABLES
		------------------------------ */
		:root {
			--bg: #1e1e1e;
			--bg-alt: #252526;
			--text: #e0e0e0;
			--accent: #61afef;
			--card-bg: #2d2d2d;
			--card-border: #3a3a3a;
			--toggle-bg: #3a3a3a;
			--toggle-text: #bbb;
		}

		:root.light {
			--bg: #fafafa;
			--bg-alt: #ffffff;
			--text: #222;
			--accent: #007acc;
			--card-bg: #ffffff;
			--card-border: #e0e0e0;
			--toggle-bg: #e0e0e0;
			--toggle-text: #555;
		}

		/* ------------------------------
			GLOBAL STYLES
		------------------------------ */
		body {
			margin: 0;
			font-family: system-ui, sans-serif;
			background: var(--bg);
			color: var(--text);
			transition: background 0.3s, color 0.3s;
		}

		header {
			padding: 3rem 1.5rem;
			text-align: center;
			background: var(--bg-alt);
			position: relative;
		}

		header h1 {
			margin: 0;
			font-size: 2.4rem;
			font-weight: 600;
		}

		header p {
			margin: 0.75rem auto 0;
			max-width: 600px;
			font-size: 1.1rem;
			opacity: 0.85;
		}

		/* Subtle theme toggle */
		.theme-toggle {
			position: absolute;
			top: 1rem;
			right: 1rem;
			padding: 0.35rem 0.7rem;
			background: var(--toggle-bg);
			color: var(--toggle-text);
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 0.8rem;
			opacity: 0.8;
			transition: opacity 0.2s, background 0.3s;
		}
		.theme-toggle:hover {
			opacity: 1;
		}

		/* ------------------------------
			 CARD GRID
		------------------------------ */
		.grid {
			display: grid;
			gap: 1.5rem;
			padding: 2rem 1.5rem;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
		}

		.card {
			background: var(--card-bg);
			border: 1px solid var(--card-border);
			border-radius: 10px;
			padding: 1.5rem;
			text-align: center;
			transition: transform 0.15s, background 0.3s;
		}

		.card:hover {
			transform: translateY(-4px);
		}

		.card img {
			width: 64px;
			height: 64px;
			margin-bottom: 1rem;
		}

		.card h3 {
			margin: 0.5rem 0 0.3rem;
			font-size: 1.2rem;
		}

		.card a {
			display: inline-block;
			margin-top: 0.5rem;
			color: var(--accent);
			text-decoration: none;
			font-weight: 500;
		}

		.placeholder {
			opacity: 0.6;
			cursor: default;
		}

		.placeholder:hover {
			transform: none;
		}

		.placeholder-icon {
			font-size: 48px;
			margin-bottom: 1rem;
			color: var(--toggle-text);
		}
	</style>
</head>

<body>
	<header>
		<button class="theme-toggle" id="themeToggle">Light Theme</button>
		<h1>Web App Hub</h1>
		<p>Browse our vast library of web applications.</p>
	</header>

	<section class="grid">
		<div class="card">
			<img src="phase-o-matic/icon/pom-64.png" alt="App Icon">
			<h3>Phase‑O‑Matic</h3>
			<a href="phase-o-matic/index.html">Open App</a>
		</div>

		<div class="card placeholder">
			<div class="placeholder-icon">⋯</div>
			<h3>More Coming Soon</h3>
		</div>
	</section>

	<script>
		const toggleBtn = document.getElementById("themeToggle");

		// Load saved theme
		const savedTheme = localStorage.getItem("theme");
		if (savedTheme === "light") {
			document.documentElement.classList.add("light");
		}

		// Set initial button label
		function updateButtonLabel() {
			const isLight = document.documentElement.classList.contains("light");
			toggleBtn.textContent = isLight ? "Dark Theme" : "Light Theme";
		}
		updateButtonLabel();

		// Toggle + save theme
		toggleBtn.addEventListener("click", () => {
			document.documentElement.classList.toggle("light");
			const isLight = document.documentElement.classList.contains("light");
			localStorage.setItem("theme", isLight ? "light" : "dark");
			updateButtonLabel();
		});
</script>
</body>
</html>
